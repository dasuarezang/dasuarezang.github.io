  :root{
    --accent:#60a5fa;--accent-deep:#2563eb;--deep:#05070c;
    --spring:cubic-bezier(.32,.72,0,1);
    --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{
    position:relative;isolation:isolate;overflow-x:clip;min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;padding:48px 28px;
    font-family:var(--font);color:#fff;background:var(--deep);-webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(42% 55% at 82% 38%,rgba(37,99,235,.38),transparent 70%),
      radial-gradient(38% 45% at 6% 92%,rgba(96,165,250,.16),transparent 70%),
      radial-gradient(30% 30% at 52% -4%,rgba(16,185,129,.10),transparent 70%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.3px);background-size:28px 28px;
    -webkit-mask-image:radial-gradient(70% 60% at 50% 50%,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 50%,#000,transparent);
  }
  main{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .logo-term{font:400 .8rem/1 'Press Start 2P',ui-monospace,monospace;color:var(--accent);margin-bottom:40px;text-decoration:none;}
  .code{
    font:600 clamp(5.5rem,24vw,9rem)/.9 var(--font);letter-spacing:-.06em;
    background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.4));-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .typing{margin-top:22px;font:400 clamp(.95rem,3.6vw,1.2rem)/1.4 var(--mono);color:#e2e8f0;}
  .typing .prompt{color:var(--accent);margin-right:10px;}
  .cursor{display:inline-block;width:.55em;height:1.1em;margin-left:4px;vertical-align:-.2em;background:var(--accent);border-radius:1px;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  p.msg{margin-top:18px;max-width:42ch;font-size:1rem;line-height:1.6;color:rgba(255,255,255,.62);}
  .back{
    display:inline-flex;align-items:center;gap:10px;margin-top:36px;padding:14px 22px;border-radius:999px;
    font:600 .95rem/1 var(--font);color:#fff;text-decoration:none;background:var(--accent-deep);
    box-shadow:0 16px 32px -14px rgba(37,99,235,.7);transition:transform .6s var(--spring),background-color .4s var(--spring);
  }
  .back:hover{transform:translateY(-2px);background:#1d4ed8;}
  .back:active{transform:scale(.97);}
  .back:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .back svg{width:18px;height:18px;flex-shrink:0;}
  .t-en{display:none;}
  html[lang="en"] .t-es{display:none;}
  html[lang="en"] .t-en{display:inline;}
  @media (hover:none){.back:hover{transform:none;background:var(--accent-deep);}}
  @media (max-width:480px){body{padding:40px 16px;}.logo-term{margin-bottom:32px;}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
